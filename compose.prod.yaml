services:
  api:
    build:
      context: .
      target: api
    image: atlair-mail-api
    restart: unless-stopped
    init: true
    env_file: [.env]
    ports:
      - "8080:8080"
    stop_grace_period: 30s

  worker:
    build:
      context: .
      target: worker
    image: atlair-mail-worker
    restart: unless-stopped
    init: true
    env_file: [.env]
    stop_grace_period: 30s
