services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atlair
      POSTGRES_PASSWORD: atlair
      POSTGRES_DB: atlair_mail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlair -d atlair_mail"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
